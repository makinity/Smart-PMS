<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-secondary-container": "#d6a9ff",
                    "on-background": "#dee2f2",
                    "on-tertiary": "#003824",
                    "secondary-fixed-dim": "#ddb7ff",
                    "tertiary-container": "#007d55",
                    "on-primary-fixed-variant": "#003ea8",
                    "inverse-on-surface": "#2b303c",
                    "secondary-container": "#6f00be",
                    "on-error-container": "#ffdad6",
                    "surface": "#0e131e",
                    "error": "#ffb4ab",
                    "on-error": "#690005",
                    "surface-container-highest": "#303541",
                    "inverse-primary": "#0053db",
                    "tertiary-fixed-dim": "#4edea3",
                    "on-surface-variant": "#c3c6d7",
                    "surface-container-lowest": "#090e19",
                    "secondary": "#ddb7ff",
                    "surface-bright": "#343946",
                    "error-container": "#93000a",
                    "on-primary": "#002a78",
                    "surface-tint": "#b4c5ff",
                    "background": "#0e131e",
                    "surface-variant": "#303541",
                    "secondary-fixed": "#f0dbff",
                    "outline": "#8d90a0",
                    "surface-dim": "#0e131e",
                    "on-secondary-fixed": "#2c0051",
                    "on-primary-container": "#eeefff",
                    "on-primary-fixed": "#00174b",
                    "tertiary": "#4edea3",
                    "outline-variant": "#434655",
                    "inverse-surface": "#dee2f2",
                    "primary-container": "#2563eb",
                    "on-surface": "#dee2f2",
                    "surface-container": "#1b1f2b",
                    "on-tertiary-container": "#bdffdb",
                    "tertiary-fixed": "#6ffbbe",
                    "surface-container-high": "#252a36",
                    "primary": "#b4c5ff",
                    "on-secondary-fixed-variant": "#6900b3",
                    "on-tertiary-fixed": "#002113",
                    "surface-container-low": "#171b27",
                    "on-secondary": "#490080",
                    "primary-fixed-dim": "#b4c5ff",
                    "on-tertiary-fixed-variant": "#005236",
                    "primary-fixed": "#dbe1ff"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "md": "24px",
                    "xl": "48px",
                    "container-max": "1440px",
                    "base": "4px",
                    "lg": "32px",
                    "gutter": "24px",
                    "xs": "8px",
                    "sm": "16px"
            },
            "fontFamily": {
                    "body-sm": ["Inter"],
                    "headline-lg": ["Inter"],
                    "display-lg": ["Inter"],
                    "body-md": ["Inter"],
                    "label-caps": ["Inter"],
                    "title-md": ["Inter"]
            },
            "fontSize": {
                    "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                    "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                    "title-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            vertical-align: middle;
        }
        .glass-panel {
            background: rgba(16, 23, 34, 0.96);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .modal-shadow {
            box-shadow: 0 12px 24px -6px rgba(0, 0, 0, 0.5), 0 0 1px 0 rgba(37, 99, 235, 0.2);
        }
        .inner-glow {
            box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.05);
        }
        .bg-noise {
            background-image: url("https://www.transparenttextures.com/patterns/carbon-fibre.png");
            opacity: 0.03;
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md selection:bg-primary/30 min-h-screen overflow-hidden">
<!-- Blurred Content Frame 5 Background -->
<div class="fixed inset-0 z-0 flex blur-md saturate-50 opacity-60 pointer-events-none">
<aside class="w-64 bg-surface-container border-r border-outline-variant/10 p-lg">
<div class="h-8 w-32 bg-surface-container-highest rounded-lg mb-xl"></div>
<div class="space-y-sm">
<div class="h-10 w-full bg-primary/10 rounded-lg"></div>
<div class="h-10 w-full bg-surface-container-highest rounded-lg"></div>
<div class="h-10 w-full bg-surface-container-highest rounded-lg"></div>
<div class="h-10 w-full bg-surface-container-highest rounded-lg"></div>
</div>
</aside>
<main class="flex-1 p-xl">
<div class="grid grid-cols-3 gap-gutter">
<div class="h-48 bg-surface-container rounded-xl"></div>
<div class="h-48 bg-surface-container rounded-xl"></div>
<div class="h-48 bg-surface-container rounded-xl"></div>
</div>
<div class="mt-xl h-96 bg-surface-container rounded-xl"></div>
</main>
</div>
<!-- Modal Overlay -->
<div class="fixed inset-0 z-50 flex items-center justify-center bg-background/60 backdrop-blur-sm">
<!-- Modal Container (480px) -->
<section class="relative w-[480px] glass-panel modal-shadow rounded-xl overflow-hidden flex flex-col animate-in fade-in zoom-in duration-300">
<div class="absolute inset-0 bg-noise pointer-events-none"></div>
<!-- Header -->
<header class="relative px-lg py-sm flex justify-between items-center border-b border-outline-variant/10 inner-glow">
<div>
<h2 class="font-title-md text-title-md text-on-surface">Calibrate &amp; Release</h2>
<p class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest">HRMO — FY 2026</p>
</div>
<button class="p-xs hover:bg-surface-container-highest rounded-full transition-colors group">
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-on-surface">close</span>
</button>
</header>
<!-- Body -->
<div class="relative p-lg space-y-md">
<!-- Comparison Boxes -->
<div class="grid grid-cols-2 gap-sm">
<!-- Computed Score -->
<div class="p-sm bg-surface-container-low rounded-lg border border-outline-variant/10 space-y-xs">
<span class="font-label-caps text-label-caps text-on-surface-variant">COMPUTED SCORE</span>
<div class="flex items-baseline gap-xs">
<span class="font-headline-lg text-headline-lg text-on-surface">3.85</span>
<span class="font-label-caps text-label-caps px-2 py-0.5 rounded bg-primary/10 text-primary border border-primary/20">VS</span>
</div>
</div>
<!-- Calibrated Rating -->
<div class="p-sm bg-secondary-container/10 rounded-lg border border-secondary-container/30 space-y-xs">
<span class="font-label-caps text-label-caps text-secondary">CALIBRATED RATING</span>
<div class="flex items-baseline gap-xs">
<span class="font-headline-lg text-headline-lg text-secondary">4.00</span>
<span class="font-label-caps text-label-caps px-2 py-0.5 rounded bg-secondary-container/20 text-secondary border border-secondary-container/40">VS PURPLE</span>
</div>
</div>
</div>
<!-- Input Field -->
<div class="space-y-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant">Final Rating (1.00–5.00)</label>
<input class="w-full h-12 bg-surface-container-lowest border border-outline-variant/30 rounded-lg px-md font-title-md text-title-md focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all placeholder:text-on-surface-variant/30" max="5" min="1" step="0.01" type="number" value="4.00"/>
</div>
<!-- Adjectival Pills -->
<div class="space-y-xs">
<span class="font-label-caps text-label-caps text-on-surface-variant">ADJECTIVAL RATING</span>
<div class="flex flex-wrap gap-xs">
<button class="px-sm py-1.5 rounded-full border border-outline-variant/20 font-label-caps text-label-caps text-on-surface-variant hover:bg-surface-container-high transition-colors">Outstanding</button>
<button class="px-sm py-1.5 rounded-full border border-secondary bg-secondary/10 font-label-caps text-label-caps text-secondary shadow-[0_0_8px_rgba(221,183,255,0.2)]">Very Satisfactory</button>
<button class="px-sm py-1.5 rounded-full border border-outline-variant/20 font-label-caps text-label-caps text-on-surface-variant hover:bg-surface-container-high transition-colors">Satisfactory</button>
<button class="px-sm py-1.5 rounded-full border border-outline-variant/20 font-label-caps text-label-caps text-on-surface-variant hover:bg-surface-container-high transition-colors">Unsatisfactory</button>
<button class="px-sm py-1.5 rounded-full border border-outline-variant/20 font-label-caps text-label-caps text-on-surface-variant hover:bg-surface-container-high transition-colors">Poor</button>
</div>
</div>
<!-- Remarks Textarea -->
<div class="space-y-xs">
<div class="flex justify-between items-center">
<label class="font-label-caps text-label-caps text-on-surface-variant">Justification / Remarks</label>
<span class="font-label-caps text-label-caps text-error">Required for calibration</span>
</div>
<textarea class="w-full h-24 bg-surface-container-lowest border border-error/50 rounded-lg p-sm font-body-sm text-body-sm focus:border-error focus:ring-1 focus:ring-error outline-none transition-all resize-none" placeholder="Provide detailed reasoning for the score adjustment..."></textarea>
</div>
</div>
<!-- Footer -->
<footer class="relative p-lg bg-surface-container-low/50 flex justify-end gap-sm border-t border-outline-variant/10">
<button class="px-lg h-10 rounded-lg font-label-caps text-label-caps text-on-surface-variant hover:bg-surface-container-highest transition-all">
                    Cancel
                </button>
<button class="px-lg h-10 rounded-lg bg-secondary-container text-white font-label-caps text-label-caps flex items-center gap-xs hover:brightness-110 active:scale-95 transition-all shadow-lg shadow-secondary-container/20">
<span class="material-symbols-outlined text-[18px]">verified</span>
                    Calibrate &amp; Release
                </button>
</footer>
</section>
</div>
<!-- Subtle atmospheric effect script -->
<script>
        document.addEventListener('mousemove', (e) => {
            const modal = document.querySelector('section');
            const rect = modal.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            // Subtly move the inner glow based on mouse
            modal.style.setProperty('--mouse-x', `${x}px`);
            modal.style.setProperty('--mouse-y', `${y}px`);
        });

        // Toggle pill active states (demo purpose)
        const pills = document.querySelectorAll('.flex.flex-wrap.gap-xs button');
        pills.forEach(pill => {
            pill.addEventListener('click', () => {
                pills.forEach(p => {
                    p.classList.remove('border-secondary', 'bg-secondary/10', 'text-secondary', 'shadow-[0_0_8px_rgba(221,183,255,0.2)]');
                    p.classList.add('border-outline-variant/20', 'text-on-surface-variant');
                });
                pill.classList.remove('border-outline-variant/20', 'text-on-surface-variant');
                pill.classList.add('border-secondary', 'bg-secondary/10', 'text-secondary', 'shadow-[0_0_8px_rgba(221,183,255,0.2)]');
            });
        });
    </script>
</body></html>
